services:
  frontend:
    build:
      context: ./dashboard_app
      dockerfile: Dockerfile
    env_file:
      - ./env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./env/backend.env
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - ./backend/app/data:/app/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gasolinera
      POSTGRES_USER: gas_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - app-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-pass}"]
    env_file:
      - ./env/backend.env
    restart: unless-stopped

  nginx:
    build:
      context: ./infra
      dockerfile: Dockerfile.nginx
    volumes:
      - ./infra/certs:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  app-data:
